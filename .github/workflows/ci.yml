name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never on main: a newer push would cancel a production migration halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build

  database:
    name: Migrations and database tests (local Supabase)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, storage, API gateway)
        run: npx supabase start --exclude studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # The tests talk to Auth and Storage as well as Postgres, so they need the keys this
      # throwaway local stack prints. They are generated per run and are not real secrets.
      - name: Point the tests at the local Supabase
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          secret="$(value SECRET_KEY)"
          echo "::add-mask::$secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run test:db

  # Browser tests against a production build and a throwaway local Supabase: the platform owner
  # onboards a business from the console and its admin signs in (ADR-029).
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, storage, API gateway)
        run: npx supabase start --exclude studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # Same throwaway keys as the database job. They are also needed at build time, because
      # Next.js writes the NEXT_PUBLIC_ values into the browser bundle.
      - name: Point the app at the local Supabase
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          secret="$(value SECRET_KEY)"
          echo "::add-mask::$secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Applies new migrations to the production database after a merge to main (ADR-065), once the
  # code checks pass and every migration has applied cleanly to a fresh database above. It runs in
  # the `production` environment: its secret lives there, and the environment can require a
  # person's approval first. Vercel deploys main in parallel, so new code can briefly run before
  # its migration: migrations must stay backward compatible (add first, remove in a later release).
  migrate-production:
    name: Migrate production database
    needs: [checks, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      DATABASE_URL_DIRECT: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
    steps:
      - name: Require the production database secret
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error::Add PRODUCTION_DATABASE_URL_DIRECT (Supabase direct connection, port 5432) to the 'production' environment's secrets."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Refuses when production's migration history is missing or foreign, which would make
      # Drizzle replay migrations onto live data; otherwise lists what will be applied.
      - name: Check migration history
        run: node scripts/check-migrations.mjs
      - name: Apply migrations
        run: npm run db:migrate
