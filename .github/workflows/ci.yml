name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run. On main, runs queue instead: a run
  # cancelled part-way could otherwise stop a production migration (ADR-075).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build

  database:
    name: Migrations and database tests (local Supabase)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, storage, realtime, API gateway)
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # The tests talk to Auth and Storage as well as Postgres, so they need the keys this
      # throwaway local stack prints. They are generated per run and are not real secrets.
      - name: Point the tests at the local Supabase
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          secret="$(value SECRET_KEY)"
          echo "::add-mask::$secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run test:db

  # Browser tests against a production build and a throwaway local Supabase: the platform owner
  # onboards a business from the console and its admin signs in (ADR-029).
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, storage, realtime, API gateway)
        run: npx supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # Same throwaway keys as the database job. They are also needed at build time, because
      # Next.js writes the NEXT_PUBLIC_ values into the browser bundle.
      - name: Point the app at the local Supabase
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          secret="$(value SECRET_KEY)"
          echo "::add-mask::$secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Production migrations (ADR-075): once every check has passed on main, apply the pending
  # migrations to the production database, here and never from a laptop (docs/architecture.md
  # §12). Drizzle applies them all in one transaction, so a failure leaves production as it was.
  migrate-production:
    name: Migrate production database
    needs: [checks, database, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The secret lives in the `production` environment, which can require an approval and be
    # limited to main in the repository's settings.
    environment: production
    # One at a time, and never cancelled part-way.
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    env:
      DATABASE_URL_DIRECT: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
    steps:
      - name: Check the production database is configured
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error title=Production not migrated::Add the secret PRODUCTION_DATABASE_URL_DIRECT to the production environment: the Supabase session pooler URL (port 5432). See ADR-075."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
